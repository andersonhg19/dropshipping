# ============================================================
# Docker Compose UNIFICADO - VISNEX Platform
# Levanta TODO: infra + WordPress + backend + frontend
# Uso: docker-compose --env-file ./backend/.env up --build -d
# ------------------------------------------------------------
# SEGURIDAD (2026-08-07):
#  - Ningun secreto tiene valor por defecto. Se usa ${VAR:?mensaje} para que
#    el arranque FALLE si falta, en vez de arrancar con una clave conocida.
#  - Los puertos de los microservicios y las bases de datos se publican SOLO
#    en 127.0.0.1: siguen accesibles para desarrollo local, pero no quedan
#    expuestos a la red (wifi, LAN). Solo el gateway, el frontend y WordPress
#    escuchan en todas las interfaces.
#  - Copia backend/.env.example a backend/.env y rellenalo antes de levantar.
# ============================================================

networks:
  visnex-network:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:
  wp-languages:
  wp-content:

services:

  # ==================== DATABASES ====================
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - visnex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en backend/.env}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress_vn}
      MYSQL_USER: ${WORDPRESS_DB_USER:?falta WORDPRESS_DB_USER en backend/.env}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?falta WORDPRESS_DB_PASSWORD en backend/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - visnex-network
    command: '--default-authentication-plugin=mysql_native_password'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== WORDPRESS ====================
  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress_vn}
      WORDPRESS_TABLE_PREFIX: vn_
      # 0 en cualquier entorno que no sea depuracion activa: con 1, los avisos
      # de PHP se imprimen en la pagina y se ven en la tienda.
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      # Correo. Sin esto el cliente no recibe confirmacion de su pedido y tu no
      # te enteras de que has vendido. Las credenciales van en .env, nunca aqui:
      # este repositorio es publico.
      VN_SMTP_HOST:   ${VN_SMTP_HOST:-}
      VN_SMTP_PORT:   ${VN_SMTP_PORT:-587}
      VN_SMTP_USER:   ${VN_SMTP_USER:-}
      VN_SMTP_PASS:   ${VN_SMTP_PASS:-}
      VN_SMTP_FROM:   ${VN_SMTP_FROM:-}
      VN_SMTP_NOMBRE: ${VN_SMTP_NOMBRE:-VISNEX}
      # ------------------------------------------------------------------
      # LA TIENDA RESPONDE AL NOMBRE POR EL QUE LA LLAMEN
      #
      # WordPress guarda su direccion en la base de datos, asi que si se fija a
      # "localhost" no se puede abrir desde el movil, y si se fija a la IP deja
      # de funcionar desde el portatil. Lo normal es cambiarla a mano cada vez.
      #
      # Aqui se resuelve sola: se toma el host de la peticion, comprobado
      # contra una lista cerrada. Asi el mismo contenedor sirve en
      # localhost:8850 y en 192.168.40.32:8850, y el dia que haya dominio solo
      # hay que anadirlo a la lista.
      #
      # La comprobacion contra lista NO es adorno: la cabecera Host la controla
      # quien hace la peticion, y sin filtro se puede envenenar el enlace de
      # "restablecer contrasena" para que apunte al sitio del atacante.
      # ------------------------------------------------------------------
      WORDPRESS_CONFIG_EXTRA: |
        $$vn_permitidos = array(
            'localhost:8850',
            '127.0.0.1:8850',
            '192.168.40.32:8850',
        );
        $$vn_host = isset($$_SERVER['HTTP_HOST']) ? $$_SERVER['HTTP_HOST'] : 'localhost:8850';
        if (!in_array($$vn_host, $$vn_permitidos, true)) {
            $$vn_host = 'localhost:8850';
        }
        define('WP_HOME',    'http://' . $$vn_host);
        define('WP_SITEURL', 'http://' . $$vn_host);
    volumes:
      # ------------------------------------------------------------------
      # wp-content vive en un VOLUMEN DE DOCKER, no en el bind mount.
      #
      # Medido en el navegador con el bind mount: TTFB de 4,2 s y hasta 33 s
      # bajo carga, con el primer pintado a los 116 s. La causa es que
      # wp-content tiene 10.901 ficheros y 97 MB de plugins, y CADA peticion
      # -incluidas las 39 de CSS, JS e imagenes- cruza la frontera entre
      # Windows y el contenedor. Leer 500 ficheros de ahi tarda 31 s.
      #
      # Dentro de un volumen, esos ficheros estan en el ext4 de la maquina
      # virtual de Docker: no cruzan nada.
      #
      # LO QUE SE EDITA A MANO SIGUE EN EL REPO, montado ENCIMA del volumen:
      # el tema y el plugin propios. Asi se sigue trabajando desde Windows y
      # desde git, y solo WooCommerce, Yoast y las subidas viven en el volumen.
      #
      # Las subidas dejan de verse desde el Explorador de Windows. Para
      # sacarlas:  docker cp dropshipping-wordpress-1:/var/www/html/wp-content/uploads ./copia
      # ------------------------------------------------------------------
      - wp-content:/var/www/html/wp-content
      - ./wordpress/wp-content/themes/visnex:/var/www/html/wp-content/themes/visnex
      - ./wordpress/wp-content/plugins/visnex-colombia:/var/www/html/wp-content/plugins/visnex-colombia
      - ./wordpress/config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      # Sin esto, cada peticion revalidaba ~1.500 ficheros contra el bind mount
      # de Windows y el TTFB era de 18 s. Ver el comentario de opcache.ini.
      - ./wordpress/config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      # Las traducciones NO van en el bind mount de Windows. Son 11 MB y varios
      # miles de ficheros que WordPress lee en CADA peticion, y medido aqui esa
      # sola carpeta costaba entre 2 y 7 s por pagina: en ingles el sitio
      # respondia en 2,3 s y en espanol se iba a 4-9 s. Es una carpeta que
      # gestiona WordPress solo (Ajustes -> Generales -> Idioma), no algo que se
      # edite a mano, asi que vive mejor en un volumen del propio Docker.
      - wp-languages:/var/www/html/wp-content/languages
      # WP-CLI montado, no instalado dentro del contenedor: al recrearlo se
      # perdia (vive en la capa de imagen) y habia que volver a bajarlo. Desde
      # aqui sobrevive a `docker compose up --build`.
      #   docker exec -w /var/www/html dropshipping-wordpress-1 wp <lo que sea> --allow-root
      - ./wordpress/config/wp-cli.phar:/usr/local/bin/wp:ro
    ports:
      - "8850:80"
    networks:
      - visnex-network

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8851:80"
    networks:
      - visnex-network

  # ==================== INFRASTRUCTURE ====================
  discovery-service:
    image: vn-discovery
    build:
      context: ./backend/discovery-service
    ports:
      - "127.0.0.1:8840:8840"
    networks:
      - visnex-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8840/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway-service:
    image: vn-gateway
    build:
      context: ./backend/gateway-service
    ports:
      - "8841:8841"
    depends_on:
      discovery-service:
        condition: service_healthy
    environment:
      SECRET: ${SECRET:?falta SECRET en backend/.env}
      EXP_TIME: ${EXP_TIME:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:8850}
    networks:
      - visnex-network

  # ==================== BACKEND SERVICES ====================
  auth-service:
    image: vn-auth
    build:
      context: ./backend/auth-service
    ports:
      - "127.0.0.1:8842:8842"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET: ${SECRET:?falta SECRET en backend/.env}
      EXP_TIME: ${EXP_TIME:-86400000}
    networks:
      - visnex-network

  language-service:
    image: vn-language
    build:
      context: ./backend/language-service
    ports:
      - "127.0.0.1:8843:8843"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lang_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET: ${SECRET:?falta SECRET en backend/.env}
      EXP_TIME: ${EXP_TIME:-86400000}
    networks:
      - visnex-network

  administration-service:
    image: vn-administration
    build:
      context: ./backend/administration-service
    ports:
      - "127.0.0.1:8844:8844"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/admin_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET: ${SECRET:?falta SECRET en backend/.env}
      EXP_TIME: ${EXP_TIME:-86400000}
    networks:
      - visnex-network

  audit-service:
    image: vn-audit
    build:
      context: ./backend/audit-service
    # Sin `ports`: solo alcanzable dentro de la red de Docker. El log de
    # auditoria no tiene por que ser accesible desde el host.
    expose:
      - "8845"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET: ${SECRET:?falta SECRET en backend/.env}
      EXP_TIME: ${EXP_TIME:-86400000}
    networks:
      - visnex-network

  commerce-service:
    image: vn-commerce
    build:
      context: ./backend/commerce-service
    ports:
      - "127.0.0.1:8847:8847"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commerce_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET: ${SECRET:?falta SECRET en backend/.env}
      EXP_TIME: ${EXP_TIME:-86400000}
      WC_URL: ${WC_URL:-http://wordpress:80}
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-}
    networks:
      - visnex-network

  acquisition-service:
    image: vn-acquisition
    build:
      context: ./backend/acquisition-service
    ports:
      - "127.0.0.1:8846:8846"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/acquisition_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET: ${SECRET:?falta SECRET en backend/.env}
      EXP_TIME: ${EXP_TIME:-86400000}
    networks:
      - visnex-network

  # ==================== FRONTEND ====================
  frontend:
    image: vn-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8841}
        NEXT_PUBLIC_ID_COMPANY: ${NEXT_PUBLIC_ID_COMPANY:-1}
        NEXT_PUBLIC_TZ: ${NEXT_PUBLIC_TZ:-America/Bogota}
        NEXT_PUBLIC_CACHE_SECRET: ${NEXT_PUBLIC_CACHE_SECRET:?falta NEXT_PUBLIC_CACHE_SECRET en backend/.env}
    ports:
      - "3001:3000"
    depends_on:
      - gateway-service
    networks:
      - visnex-network
