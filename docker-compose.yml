# ============================================================
# Docker Compose UNIFICADO - VISNEX Platform
# Levanta TODO: infra + WordPress + backend + frontend
# Uso: docker-compose --env-file ./backend/.env up --build -d
# ============================================================

networks:
  visnex-network:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:

services:

  # ==================== DATABASES ====================
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Visnex2026}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - visnex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vnroot2026}
      MYSQL_DATABASE: wordpress_vn
      MYSQL_USER: ${MYSQL_USER:-vn_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vnpass2026}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - visnex-network
    command: '--default-authentication-plugin=mysql_native_password'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== WORDPRESS ====================
  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-vn_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-vnpass2026}
      WORDPRESS_DB_NAME: wordpress_vn
      WORDPRESS_TABLE_PREFIX: vn_
      WORDPRESS_DEBUG: 1
    volumes:
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./wordpress/config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    ports:
      - "8850:80"
    networks:
      - visnex-network

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vnroot2026}
    ports:
      - "8851:80"
    networks:
      - visnex-network

  # ==================== INFRASTRUCTURE ====================
  discovery-service:
    image: vn-discovery
    build:
      context: ./backend/discovery-service
    ports:
      - "8840:8840"
    networks:
      - visnex-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8840/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway-service:
    image: vn-gateway
    build:
      context: ./backend/gateway-service
    ports:
      - "8841:8841"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - visnex-network

  # ==================== BACKEND SERVICES ====================
  auth-service:
    image: vn-auth
    build:
      context: ./backend/auth-service
    ports:
      - "8842:8842"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Visnex2026}
      SECRET: ${SECRET:-visnex@secret.key}
      EXP_TIME: ${EXP_TIME:-864000000}
    networks:
      - visnex-network

  language-service:
    image: vn-language
    build:
      context: ./backend/language-service
    ports:
      - "8843:8843"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lang_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Visnex2026}
      SECRET: ${SECRET:-visnex@secret.key}
      EXP_TIME: ${EXP_TIME:-864000000}
    networks:
      - visnex-network

  administration-service:
    image: vn-administration
    build:
      context: ./backend/administration-service
    ports:
      - "8844:8844"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/admin_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Visnex2026}
      SECRET: ${SECRET:-visnex@secret.key}
      EXP_TIME: ${EXP_TIME:-864000000}
    networks:
      - visnex-network

  audit-service:
    image: vn-audit
    build:
      context: ./backend/audit-service
    ports:
      - "8845:8845"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Visnex2026}
      SECRET: ${SECRET:-visnex@secret.key}
      EXP_TIME: ${EXP_TIME:-864000000}
    networks:
      - visnex-network

  commerce-service:
    image: vn-commerce
    build:
      context: ./backend/commerce-service
    ports:
      - "8847:8847"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commerce_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Visnex2026}
      SECRET: ${SECRET:-visnex@secret.key}
      EXP_TIME: ${EXP_TIME:-864000000}
      WC_URL: ${WC_URL:-http://wordpress:8850}
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-}
    networks:
      - visnex-network

  acquisition-service:
    image: vn-acquisition
    build:
      context: ./backend/acquisition-service
    ports:
      - "8846:8846"
    depends_on:
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/acquisition_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Visnex2026}
      SECRET: ${SECRET:-visnex@secret.key}
      EXP_TIME: ${EXP_TIME:-864000000}
    networks:
      - visnex-network

  # ==================== FRONTEND ====================
  frontend:
    image: vn-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8841}
        NEXT_PUBLIC_ID_COMPANY: ${NEXT_PUBLIC_ID_COMPANY:-1}
        NEXT_PUBLIC_TZ: ${NEXT_PUBLIC_TZ:-America/Bogota}
        NEXT_PUBLIC_CACHE_SECRET: ${NEXT_PUBLIC_CACHE_SECRET:-changeme123}
    ports:
      - "3001:3000"
    depends_on:
      - gateway-service
    networks:
      - visnex-network
