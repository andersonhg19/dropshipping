server.port=8845
server.servlet.context-path=/vn-api
spring.application.name=audit-service

spring.config.import=optional:file:.env[.properties]

eureka.instance.preferIpAddress=true
spring.cloud.discovery.enabled=true
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:postgresql://localhost:5433/audit_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Visnex2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

eureka.client.serviceUrl.defaultZone=http://discovery-service:8840/eureka

secret=${SECRET:secret@spring.io}
expired-time=${EXP_TIME:864000000}
secretConnexion=3a1f8a790c238b8df0d447b53d792134b5cc7f2c8f7f62f168e4d1c978e5f384
secretUser=admin
secretKey=31bb8e6ce28529dc8adad799f5eea8a7.7913235c8702e1ccf810cd1b04c17440
authUrl=http://gateway-service:8841/AUTHENTICATION-SERVICE/vn-api
languageMicroserviceUrl=http://gateway-service:8841/LANGUAGE-SERVICE/vn-api/v2/message/getOneMessage/
administrationMicroserviceUrl=http://gateway-service:8841/ADMINISTRATION-SERVICE/vn-api/v2/

language=es

# Audit Log Retention Configuration
audit.retention.max-records=${AUDIT_MAX_RECORDS:1000000}
audit.retention.cleanup-batch-size=${AUDIT_CLEANUP_BATCH:10000}
audit.retention.cleanup-enabled=${AUDIT_CLEANUP_ENABLED:true}
audit.retention.cleanup-cron=${AUDIT_CLEANUP_CRON:0 0 2 * * ?}

# uri de acceso http://localhost:8845/vn-api/audit-service/swagger-ui/index.html
openapi.service.title=AUDIT-SERVICE
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/audit-service/swagger-ui.html

