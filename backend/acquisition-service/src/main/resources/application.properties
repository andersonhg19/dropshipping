server.port=8846
server.servlet.context-path=/vn-api
spring.application.name=acquisition-service

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/acquisition_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Visnex2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.serviceUrl.defaultZone=http://discovery-service:8840/eureka
eureka.instance.prefer-ip-address=true

# JWT
secret=${SECRET:visnex@secret.key}
expired-time=${EXP_TIME:864000000}
secretConnexion=${SECRET_CONNEXION:default-dev-key-change-in-production}

# Internal auth (for inter-service communication)
secretUser=${SECRET_USER:internalServiceUser}
secretKey=${SECRET_KEY:internalServiceKey}

# Inter-service URLs
authUrl=http://gateway-service:8841/AUTHENTICATION-SERVICE/vn-api
languageMicroserviceUrl=http://gateway-service:8841/LANGUAGE-SERVICE/vn-api/v2/message/getOneMessage/
administrationMicroserviceUrl=http://gateway-service:8841/ADMINISTRATION-SERVICE/vn-api/v2/
auditMicroserviceUrl=http://gateway-service:8841/AUDIT-SERVICE/vn-api

# Swagger
springdoc.api-docs.path=/acquisition-service/api-docs
springdoc.swagger-ui.path=/acquisition-service/swagger-ui.html
# uri de acceso http://localhost:8846/vn-api/acquisition-service/swagger-ui/index.html

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=visnex-acquisition-service
info.app.version=1.0.0
