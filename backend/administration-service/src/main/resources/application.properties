server.port=8844
server.servlet.context-path=/vn-api
spring.application.name=administration-service

spring.config.import=optional:file:.env[.properties]

eureka.instance.preferIpAddress=true
spring.cloud.discovery.enabled=true
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=jdbc:postgresql://localhost:5433/admin_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

eureka.client.serviceUrl.defaultZone=http://discovery-service:8840/eureka

secret=${SECRET}
expired-time=${EXP_TIME:864000000}
secretConnexion=${SECRET_CONNEXION}
secretUser=${SECRET_USER}
secretKey=${SECRET_KEY}
authUrl=http://gateway-service:8841/AUTHENTICATION-SERVICE/vn-api
languageMicroserviceUrl=http://gateway-service:8841/LANGUAGE-SERVICE/vn-api/v2/message/getOneMessage/
administrationMicroserviceUrl=http://gateway-service:8841/ADMINISTRATION-SERVICE/vn-api/v2/
auditMicroserviceUrl=http://gateway-service:8841/AUDIT-SERVICE/vn-api

language=es

# uri de acceso http://localhost:8844/vn-api/administration-service/swagger-ui/index.html
openapi.service.title=ADMINISTRATION-SERVICE
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/administration-service/swagger-ui.html

temporalPassword=${TEMPORAL_PASSWORD}
notificationServiceUrl=http://gateway-service:8841/NOTIFICATION-SERVICE/vn-api/v1/notifications
frontend.reset.base-url=${FRONTEND_RESET_BASE_URL:http://localhost:3001/users/reset-password}
password.reset.ttl.seconds=900
notification.email.enabled=true
