server.port=8847
server.servlet.context-path=/vn-api
spring.application.name=commerce-service

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/commerce_db
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Visnex2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.serviceUrl.defaultZone=http://discovery-service:8840/eureka
eureka.instance.prefer-ip-address=true

# JWT
secret=${SECRET:visnex@secret.key}
expired-time=${EXP_TIME:864000000}
secretConnexion=3a1f8a790c238b8df0d447b53d792134b5cc7f2c8f7f62f168e4d1c978e5f384
secretUser=${SECRET_USER:internalServiceUser}
secretKey=${SECRET_KEY:internalServiceKey}

# Inter-service URLs
authUrl=http://gateway-service:8841/AUTHENTICATION-SERVICE/vn-api
languageMicroserviceUrl=http://gateway-service:8841/LANGUAGE-SERVICE/vn-api/v2/message/getOneMessage/
administrationMicroserviceUrl=http://gateway-service:8841/ADMINISTRATION-SERVICE/vn-api/v2/
auditMicroserviceUrl=http://gateway-service:8841/AUDIT-SERVICE/vn-api
acquisitionMicroserviceUrl=http://gateway-service:8841/ACQUISITION-SERVICE/vn-api/v2/

# WooCommerce
woocommerce.url=${WC_URL:http://wordpress:8850}
woocommerce.consumer-key=${WC_CONSUMER_KEY:}
woocommerce.consumer-secret=${WC_CONSUMER_SECRET:}

# Swagger
springdoc.api-docs.path=/commerce-service/api-docs
springdoc.swagger-ui.path=/commerce-service/swagger-ui.html
