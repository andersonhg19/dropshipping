server:
  port: 8841

logging:
  level:
    org:
      springframework:
        web:
          cors: INFO

spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: true
    gateway:
      globalCors:
        corsConfigurations:
          '[/**]':
            # ANTES: allowedOriginPatterns "*" junto a allowCredentials true.
            # Esa combinacion permite que CUALQUIER sitio web haga peticiones
            # autenticadas contra la API con las credenciales del usuario.
            # Ahora la lista es explicita y se configura por entorno.
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:8850,http://192.168.40.32:3001,http://192.168.40.32:8850}
            allowedHeaders:
              - Authorization
              - Content-Type
              - lng
              - Accept
              - Origin
              - X-Requested-With
            exposedHeaders:
              - Content-Disposition
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowCredentials: true
            maxAge: 3600

eureka:
  instance:
    preferIpAddress: false
  client:
    service-url:
      defaultZone: http://discovery-service:8840/eureka
