; ============================================================================
;  OPcache — VISNEX / D'MIKA
; ----------------------------------------------------------------------------
;  POR QUE ESTE ARCHIVO EXISTE
;  La tienda tardaba 14-20 s en responder. Medido: NO era la red, ni la base de
;  datos (144 consultas, normal), ni el tema (sin plugins carga en 0,18 s).
;
;  Era el disco. El bind mount de Docker Desktop en Windows tarda ~78 ms en
;  LEER cada archivo PHP (lo normal son 0,05 ms). WooCommerce tiene 3.561
;  archivos PHP. La cuenta sale sola.
;
;  OPcache ya venia activo, pero con los valores por defecto no le cabia todo
;  y reciclaba constantemente: cada expulsion obliga a releer del disco lento.
; ============================================================================

opcache.enable=1
opcache.enable_cli=0

; 128 MB por defecto se quedaba corto con WordPress + WooCommerce + dos temas.
opcache.memory_consumption=256

; 10.000 por defecto; solo WooCommerce ya son 3.561 archivos.
opcache.max_accelerated_files=50000

; Cadenas internas: WooCommerce genera muchisimas.
opcache.interned_strings_buffer=32

; Comprobar cambios como mucho cada 60 s en vez de en CADA peticion. Cada
; comprobacion es un stat contra el disco lento, y son miles por carga.
; En desarrollo significa que un cambio en PHP puede tardar hasta 1 minuto en
; verse; para forzarlo antes basta reiniciar el contenedor.
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; El bytecode compilado tambien en disco DENTRO del contenedor (rapido), para
; que sobreviva a un reinicio de PHP y no haya que releer del bind mount.
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0

; Nada de perder tiempo comprobando permisos en cada acceso.
opcache.validate_permission=0
opcache.huge_code_pages=0
