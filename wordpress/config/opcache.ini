; ---------------------------------------------------------------------------
; OPCACHE — la diferencia entre 18 segundos y medio segundo.
;
; El problema no era WordPress: era que ./wordpress/wp-content es un bind mount
; de Windows. Medido dentro del contenedor, leer 500 ficheros de ese mount
; tarda 31 s (62 ms por fichero) frente a microsegundos en la capa de imagen.
;
; Con validate_timestamps=On y revalidate_freq=2, OPcache hace un stat() de
; CADA fichero cacheado cada 2 segundos. WordPress con WooCommerce carga ~1.500
; ficheros por peticion, asi que cada carga de pagina pagaba 1.500 stats sobre
; el mount lento. De ahi los 18 s de TTFB, incluso en un 302 sin contenido.
;
; validate_timestamps=0 => OPcache no vuelve a mirar el disco nunca.
; CONSECUENCIA QUE HAY QUE SABER: al editar un .php, el cambio NO se ve hasta
; recargar OPcache. Para eso esta el script `recargar-php.sh` de este mismo
; directorio (o `docker compose restart wordpress`, que tarda mas).
; Los cambios hechos DESDE el administrador de WordPress (paginas, productos,
; imagenes, ajustes del tema) viven en la base de datos y se ven al instante:
; esto solo afecta a editar ficheros .php a mano.
; ---------------------------------------------------------------------------

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32

; 4000 se quedaba corto: solo wp-content tiene 10.901 ficheros. Cuando la tabla
; se llena, OPcache deja de cachear y los que sobran vuelven al mount lento.
opcache.max_accelerated_files = 30000

opcache.max_wasted_percentage = 10
opcache.save_comments = 1
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0

; ---------------------------------------------------------------------------
; CACHE DE RUTAS REALES
;
; Con OPcache al 95,6 % de aciertos, el arranque de WordPress seguia costando
; 5,5 s. La compilacion ya no era el problema: lo era RESOLVER las rutas.
;
; Cada `include` obliga a PHP a resolver la ruta real del fichero, y eso son
; llamadas al sistema de ficheros — sobre el bind mount de Windows, la
; operacion mas cara que hay aqui. WordPress con WooCommerce incluye ~2.000
; ficheros por peticion.
;
; El valor por defecto (4 MB y 120 s de vigencia) no da para 10.901 ficheros y
; ademas caduca cada dos minutos, asi que cada pocas peticiones se repetia el
; recorrido entero. Con 16 MB y una hora, se resuelve una vez y se reutiliza.
; ---------------------------------------------------------------------------

realpath_cache_size = 16M
realpath_cache_ttl  = 3600
