      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/acquisition_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Visnex2026}
      SECRET: ${SECRET:-visnex@secret.key}
      EXP_TIME: ${EXP_TIME:-864000000}
    networks:
      - visnex-network

networks:
  visnex-network:
    external: true
    name: dropshipping_visnex-network
