# ============================================================
# Etapa WordPress: MySQL + WordPress + phpMyAdmin
# Uso: docker-compose -f docker-compose.wp.yml up --build -d
# ============================================================

networks:
  visnex-network:
    driver: bridge

volumes:
  mysql-data:
  wpcontent:

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vnroot2026}
      MYSQL_DATABASE: wordpress_vn
      MYSQL_USER: ${MYSQL_USER:-vn_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vnpass2026}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - visnex-network
    command: '--default-authentication-plugin=mysql_native_password'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-vn_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-vnpass2026}
      WORDPRESS_DB_NAME: wordpress_vn
      WORDPRESS_TABLE_PREFIX: vn_
      # 0 a proposito: con 1, los avisos de PHP se imprimen DENTRO de la
      # tienda. Un "Deprecated:" en mitad de la descripcion de un producto
      # es lo menos comercial que puede pasar.
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      # -----------------------------------------------------------------
      # RENDIMIENTO: la tienda tardaba 15-19 SEGUNDOS en responder.
      # El tiempo NO se iba en disco ni en red (medido: 14 ms un CSS, 4 ms
      # un PHP trivial). Se iba en llamadas HTTP salientes que se quedaban
      # esperando, porque el contenedor no alcanza bien internet:
      #   - Mercado Pago manda telemetria a api.mercadopago.com EN CADA CARGA
      #   - WordPress y los plugins comprueban actualizaciones
      #   - wp-cron se dispara en cada visita
      # -----------------------------------------------------------------
      WORDPRESS_CONFIG_EXTRA: |
        /* Nada de peticiones salientes salvo las que se autoricen abajo. */
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        /* Cuando toque cobrar de verdad, se anaden aqui los hosts de la
           pasarela. Mientras sea tienda de pruebas, ninguno hace falta. */
        define('WP_ACCESSIBLE_HOSTS', 'localhost');
        /* wp-cron deja de correr en cada visita del cliente. */
        define('DISABLE_WP_CRON', true);
        /* Sin comprobacion automatica de actualizaciones en un entorno local. */
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
    volumes:
      # ---------------------------------------------------------------------
      #  RENDIMIENTO — por que wp-content NO se monta entero desde Windows
      #
      #  Medido: el bind mount de Docker Desktop tarda ~78 ms en LEER cada
      #  archivo PHP (lo normal son 0,05 ms). WooCommerce tiene 3.561 archivos.
      #  Con wp-content entero montado, la portada tardaba 14-20 s; sin plugins,
      #  0,18 s. El disco era el cuello de botella, no el tema ni la base.
      #
      #  Solucion: wp-content vive en un VOLUMEN de Docker (dentro de la VM,
      #  rapido) y solo se montan encima las tres carpetas que editamos
      #  nosotros. Asi WooCommerce se lee rapido y nuestro codigo sigue
      #  recargando al guardar, sin copiar nada a mano.
      # ---------------------------------------------------------------------
      - wpcontent:/var/www/html/wp-content
      - ./wordpress/wp-content/themes/visnex:/var/www/html/wp-content/themes/visnex
      - ./wordpress/wp-content/plugins/visnex-colombia:/var/www/html/wp-content/plugins/visnex-colombia
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./wordpress/config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
    ports:
      - "8850:80"
    networks:
      - visnex-network

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vnroot2026}
    ports:
      - "8851:80"
    networks:
      - visnex-network
