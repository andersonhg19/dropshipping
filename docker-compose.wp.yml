# ============================================================
# Etapa WordPress: MySQL + WordPress + phpMyAdmin
# Uso: docker-compose -f docker-compose.wp.yml up --build -d
# ============================================================

networks:
  visnex-network:
    driver: bridge

volumes:
  mysql-data:
  # OJO: este volumen se llama `wpcontent` (sin guion) y docker-compose.yml
  # usaba `wp-content` (con guion). Eran DOS volumenes distintos con dos copias
  # casi gemelas de WooCommerce y de las subidas: 11.568 ficheros contra
  # 11.577. Segun con que archivo se levantara la tienda, salia una u otra.
  # Se comprobo cual estaba vivo comparando las miniaturas: aqui estan las de
  # 324x432 (las que genera la densidad actual) y alli las de 324x454, viejas.
  # Los dos archivos apuntan ahora a este.
  wpcontent:

services:
  mysql:
    image: mysql:8.0
    # `always` y NO `unless-stopped`. Esta linea decia lo contrario y el
    # razonamiento era erroneo; lo demuestra lo que paso el 1 de septiembre:
    #
    #   17:39:55  mysql: "Received SHUTDOWN from user <via user signal>"
    #   17:39:55  apache: "caught SIGWINCH, shutting down gracefully"
    #   ...       los tres contenedores parados, RestartCount = 0
    #   23:40     Docker vuelve, los 25 contenedores de BOPOS arrancan solos
    #   00:40     los tres de esta tienda seguian abajo, 7 horas despues
    #
    # No fue una caida: a los dos procesos les llego una orden de parada
    # limpia y la atendieron. La diferencia esta en la POLITICA. Docker marca
    # un contenedor parado a proposito, y `unless-stopped` significa
    # literalmente "no lo levantes si alguien lo paro". O sea que la tienda
    # quedaba abajo hasta que alguien se acordara de mirarla.
    #
    # `always` lo levanta igual cuando el demonio vuelve. Para una tienda de
    # pruebas que tiene que estar disponible en la red de casa, ese es el
    # comportamiento que se quiere: parar a mano es momentaneo, no permanente.
    restart: always
    # MySQL tarda mas de 10 s en cerrar sus tablas. Con el margen por defecto,
    # un `compose down` lo remata con SIGKILL y sale con codigo 137 — que es
    # exactamente lo que parecia "se esta cayendo por memoria" y no lo era.
    stop_grace_period: 60s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vnroot2026}
      MYSQL_DATABASE: wordpress_vn
      MYSQL_USER: ${MYSQL_USER:-vn_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vnpass2026}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Atado a 127.0.0.1 A PROPOSITO, y esto NO es una inconsistencia con el
      # resto: la tienda sale a la red de casa, la base de datos no.
      #
      # "3307:3306" a secas escucha en TODAS las interfaces, o sea que
      # cualquier aparato de la red -y cualquiera que se cuelgue del wifi-
      # podia abrir MySQL. Con la contrasena por defecto de este mismo
      # archivo, que ademas vive en un repositorio publico.
      #
      # Para entrar a la base se usa phpMyAdmin (8851) o un tunel SSH.
      - "127.0.0.1:3307:3306"
    networks:
      - visnex-network
    command: '--default-authentication-plugin=mysql_native_password'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:latest
    restart: always
    # La imagen de WordPress hereda STOPSIGNAL SIGWINCH de php:apache, que en
    # Apache significa "parada elegante": espera a que terminen las conexiones
    # abiertas. Con keep-alive eso puede agotar el margen y acabar en SIGKILL
    # — que es de donde salia el codigo 137 del contenedor web.
    # SIGTERM le dice a Apache que pare ya. En una tienda de pruebas no hay
    # nada que drenar, y asi sale con codigo 0 en vez de morir a la fuerza.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-vn_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-vnpass2026}
      WORDPRESS_DB_NAME: wordpress_vn
      WORDPRESS_TABLE_PREFIX: vn_
      # 0 a proposito: con 1, los avisos de PHP se imprimen DENTRO de la
      # tienda. Un "Deprecated:" en mitad de la descripcion de un producto
      # es lo menos comercial que puede pasar.
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      # -----------------------------------------------------------------
      # RENDIMIENTO: la tienda tardaba 15-19 SEGUNDOS en responder.
      # El tiempo NO se iba en disco ni en red (medido: 14 ms un CSS, 4 ms
      # un PHP trivial). Se iba en llamadas HTTP salientes que se quedaban
      # esperando, porque el contenedor no alcanza bien internet:
      #   - Mercado Pago manda telemetria a api.mercadopago.com EN CADA CARGA
      #   - WordPress y los plugins comprueban actualizaciones
      #   - wp-cron se dispara en cada visita
      # -----------------------------------------------------------------
      WORDPRESS_CONFIG_EXTRA: |
        /* -----------------------------------------------------------------
           LA TIENDA RESPONDE AL NOMBRE POR EL QUE LA LLAMEN
           -----------------------------------------------------------------
           WordPress guarda su direccion en la base de datos y la usa para
           construir CADA enlace, CADA imagen y CADA redireccion. Si ahi pone
           `localhost`, la tienda solo sirve en la maquina donde corre Docker:
           desde el movil se ve la portada y al primer clic se salta a
           `localhost`, que para ese aparato es el mismo telefono. Sintoma
           tipico: "carga pero los enlaces no van". Y si se fija a la IP, deja
           de funcionar comoda desde el propio equipo.

           Se resuelve tomando el host de la peticion, comprobado contra una
           lista cerrada. El mismo contenedor sirve en localhost:8850 y en
           192.168.40.32:8850, y el dia que haya dominio se anade a la lista.

           La comprobacion NO es adorno: la cabecera Host la elige quien hace
           la peticion. Sin filtro se puede envenenar el enlace de
           "restablecer contrasena" para que apunte al sitio de un tercero.

           Es la misma solucion que ya usa docker-compose.yml. Estaba en un
           solo archivo de los dos, que es como se acaba con dos tiendas que
           se comportan distinto segun con que comando se levanten.
           ----------------------------------------------------------------- */
        $$vn_permitidos = array(
            'localhost:8850',
            '127.0.0.1:8850',
            '${VN_IP:-192.168.40.32}:8850',
        );
        $$vn_host = isset($$_SERVER['HTTP_HOST']) ? $$_SERVER['HTTP_HOST'] : '${VN_IP:-192.168.40.32}:8850';
        if (!in_array($$vn_host, $$vn_permitidos, true)) {
            $$vn_host = '${VN_IP:-192.168.40.32}:8850';
        }
        define('WP_HOME',    'http://' . $$vn_host);
        define('WP_SITEURL', 'http://' . $$vn_host);

        /* Nada de peticiones salientes salvo las que se autoricen abajo. */
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        /* La propia tienda entra en la lista: WordPress se llama a si mismo
           para el REST y para comprobar su estado, y con el bloqueo puesto
           esas llamadas a la IP se quedaban fuera. Cuando toque cobrar de
           verdad, aqui se anaden los hosts de la pasarela. */
        define('WP_ACCESSIBLE_HOSTS', 'localhost,127.0.0.1,${VN_IP:-192.168.40.32}');
        /* wp-cron deja de correr en cada visita del cliente. */
        define('DISABLE_WP_CRON', true);
        /* Sin comprobacion automatica de actualizaciones en un entorno local. */
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
    volumes:
      # ---------------------------------------------------------------------
      #  RENDIMIENTO — por que wp-content NO se monta entero desde Windows
      #
      #  Medido: el bind mount de Docker Desktop tarda ~78 ms en LEER cada
      #  archivo PHP (lo normal son 0,05 ms). WooCommerce tiene 3.561 archivos.
      #  Con wp-content entero montado, la portada tardaba 14-20 s; sin plugins,
      #  0,18 s. El disco era el cuello de botella, no el tema ni la base.
      #
      #  Solucion: wp-content vive en un VOLUMEN de Docker (dentro de la VM,
      #  rapido) y solo se montan encima las tres carpetas que editamos
      #  nosotros. Asi WooCommerce se lee rapido y nuestro codigo sigue
      #  recargando al guardar, sin copiar nada a mano.
      # ---------------------------------------------------------------------
      - wpcontent:/var/www/html/wp-content
      - ./wordpress/wp-content/themes/visnex:/var/www/html/wp-content/themes/visnex
      - ./wordpress/wp-content/plugins/visnex-colombia:/var/www/html/wp-content/plugins/visnex-colombia
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./wordpress/config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      # WP-CLI montado, no instalado dentro del contenedor: instalado se pierde
      # al recrearlo, porque vive en la capa de imagen. Montado sobrevive a
      # cualquier `up --build`. Ya estaba en docker-compose.yml; faltaba aqui,
      # que es el archivo con el que se levanta la tienda a diario.
      #   docker exec -w /var/www/html dropshipping-wordpress-1 wp <lo que sea> --allow-root
      - ./wordpress/config/wp-cli.phar:/usr/local/bin/wp:ro
    ports:
      - "8850:80"
    networks:
      - visnex-network
    healthcheck:
      # Marca el contenedor como enfermo si WordPress deja de responder.
      # OJO con lo que esto hace y lo que NO hace: Docker (fuera de Swarm) no
      # reinicia un contenedor por estar `unhealthy`. Solo lo etiqueta, para
      # que se vea en `docker ps` y para que `depends_on: service_healthy`
      # espere. El comentario anterior decia que "se reinicia solo" y es falso.
      #
      # `-L` sigue la redireccion: con la direccion de la tienda apuntando a
      # la IP de la red, una peticion a localhost responde 301 hacia esa IP.
      # Sin `-L` se estaria dando por bueno el redirect sin comprobar que al
      # otro lado hay una tienda.
      test: ["CMD-SHELL", "curl -fsSL -o /dev/null http://localhost/ || exit 1"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 90s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vnroot2026}
    ports:
      - "8851:80"
    networks:
      - visnex-network
